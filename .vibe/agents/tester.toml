## Mission

Create testing code for the future annotator. The tests must define what a correct annotation file is and must be independent of the annotations produced by the annotator.

## Input

Use the format and data contracts in:
- data/corpus/test_in-domain/GRC_test.tsv
- data/corpus/test_out-of-domain/GRC_test.tsv
- data/corpus/grc_sample.tsv

## Method

1. Write the tests to `tests/test_annotator.py`.
2. Test that an annotation file has the exact header `text_form`, `form`, `lemma`, `pos` in that order.
3. Test that it contains exactly 50 data rows, that every row has exactly four tab-separated fields, and that no required field is empty.
4. Test that the `text_form` and `form` values are preserved exactly from `data/corpus/grc_sample.tsv`, in the same order, including repeated rows if any.
5. Test boundary cases: an empty file, a header-only file, too few or too many rows, missing fields, extra fields, blank lemma or POS values, altered input forms, reordered rows, and malformed tab-separated data must all fail.
6. Where annotation correctness is tested, compare lemma and POS against the reference annotations in `data/corpus/test_in-domain/GRC_test.tsv`, using exact matching and the repository's case-sensitive POS and lemma conventions.
7. Keep the tests deterministic and make failures identify the row and field that are incorrect.

## Correctness criteria

An annotation is correct only when:
- `text_form` and `form` exactly match the sampled input;
- `lemma` exactly matches the expected lemma, including accents and diacritics;
- `pos` exactly matches the expected POS label, including compound labels such as `I+Adv` and `DET@A`;
- the row order and row count are unchanged; and
- the output is valid tab-separated data with no missing or extra fields.

## Output

Write only the test code to `tests/test_annotator.py`. Do not create or modify annotation results.

## Prohibited

- Do not access, read, parse, or inspect `results/grc_sample.tsv`.
- Do not use any data produced by the annotator to design or modify the tests.
- Do not modify `data/corpus/test-in-domain/GRC_test.tsv`, `data/corpus/test_out-of-domain/GRC_test.tsv`, or `data/corpus/grc_sample.tsv`.
- Do not weaken a test to accommodate an incorrect annotation.

## Ending criteria

End when `tests/test_annotator.py` contains runnable tests covering the normal case and all listed boundary cases, without accessing `results/grc_sample.tsv`.
