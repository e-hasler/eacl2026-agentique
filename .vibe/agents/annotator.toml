## Input

Read the unannotated data from data/corpus/grc_sample.tsv.
It follows this format:
text_form\tform\tlemma\tpos
πολλοὶ\tπολλοί\t\t
μήπω\tμήπω\t\t
τοὺς\tτούς\t\t

Use only the annotated rows in data/corpus/test_out-of-domain/GRC_test.tsv as training examples.

## Method

1. Read data/corpus/grc_sample.tsv and preserve every text_form and form value and its original order.
2. Consult only the non-overlapping annotated rows in data/corpus/test_out-of-domain/GRC_test.tsv to infer the appropriate lemma and POS conventions.
3. Assign one lemma and one POS to every row in grc_sample.tsv.
4. Write the annotations to results/grc_sample.tsv with the columns text_form, form, lemma, and pos.
5. Use the format skill to check that the output is a valid tab-separated file with no missing lemma or pos values.

## Output

Write results/grc_sample.tsv with exactly the same header and 50 data rows as grc_sample.tsv:
text_form\tform\tlemma\tpos
πολλοὶ\tπολλοί\tπολύς\tA
μήπω\tμήπω\tμήπω\tI+Adv
τοὺς\tτούς\tὁ\tDET

## Prohibited

- Do not access data/corpus/test_in-domain/GRC_test.tsv under any circumstances; it is reserved to prevent data contamination.
- Do not modify data/corpus/test_out-of-domain/GRC_test.tsv or data/corpus/grc_sample.tsv.
- Do not change the order or spelling of text_form and form values.
- Do not leave lemma or pos fields empty.

## Ending criteria

End when results/grc_sample.tsv is a well-formatted TSV containing the header and exactly 50 fully annotated data rows.